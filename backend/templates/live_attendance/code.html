<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Attendance - Industrial Intelligence</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-container": "#d8e3f5",
                    "background": "#f6fafd",
                    "tertiary-container": "#00855b",
                    "surface-tint": "#005ac2",
                    "on-primary": "#ffffff",
                    "surface-variant": "#dfe3e6",
                    "outline-variant": "#c2c6d6",
                    "on-secondary-container": "#5a6574",
                    "primary-fixed": "#d8e2ff",
                    "primary-fixed-dim": "#adc6ff",
                    "tertiary": "#006947",
                    "on-background": "#171c1f",
                    "secondary": "#545f6e",
                    "on-tertiary-fixed-variant": "#005236",
                    "on-secondary-fixed": "#111c29",
                    "tertiary-fixed-dim": "#4edea3",
                    "on-error": "#ffffff",
                    "primary": "#0058be",
                    "inverse-surface": "#2c3134",
                    "surface-container-lowest": "#ffffff",
                    "on-surface-variant": "#424754",
                    "error": "#ba1a1a",
                    "on-primary-fixed": "#001a42",
                    "surface-container-low": "#f0f4f7",
                    "surface-container-highest": "#dfe3e6",
                    "surface": "#f6fafd",
                    "inverse-primary": "#adc6ff",
                    "surface-container-high": "#e5e9ec",
                    "on-tertiary-fixed": "#002113",
                    "error-container": "#ffdad6",
                    "tertiary-fixed": "#6ffbbe",
                    "on-secondary": "#ffffff",
                    "primary-container": "#2170e4",
                    "on-primary-container": "#fefcff",
                    "surface-container": "#eaeef1",
                    "on-error-container": "#93000a",
                    "outline": "#727785",
                    "inverse-on-surface": "#edf1f4",
                    "secondary-fixed": "#d8e3f5",
                    "on-surface": "#171c1f",
                    "on-tertiary": "#ffffff",
                    "surface-dim": "#d6dbdd",
                    "surface-bright": "#f6fafd",
                    "on-secondary-fixed-variant": "#3d4856",
                    "on-tertiary-container": "#f5fff6",
                    "on-primary-fixed-variant": "#004395",
                    "secondary-fixed-dim": "#bcc7d8"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="bg-background text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed">
{% include 'partials/sidebar.html' %}
<!-- Main Content Area -->
<main class="ml-64 min-h-screen">
<!-- TopAppBar Shell -->
<header class="fixed top-0 right-0 left-64 h-16 bg-[#f0f4f7] flex items-center justify-between px-8 z-40">
<div class="flex items-center gap-6">
<h2 class="font-['Inter'] font-bold text-sm tracking-wide text-on-background">Live Attendance</h2>
<div class="h-4 w-[1px] bg-outline-variant"></div>
<div class="flex gap-4">
<span class="text-[#0058be] border-b-2 border-[#0058be] pb-1 font-bold text-sm cursor-pointer">CHN-01</span>
<span class="text-slate-500 font-bold text-sm cursor-pointer hover:text-[#0058be] transition-opacity">BLR-02</span>
</div>
</div>
<div class="flex items-center gap-4">
</div>
</header>
<!-- Page Content -->
<div class="pt-24 px-8 pb-8">
<!-- Filter Controls -->
<div class="mb-8 flex flex-wrap items-end justify-between gap-6">
<div class="flex gap-6">
<div class="space-y-2">
<label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant px-1">Department</label>
<div class="relative">
<select class="appearance-none bg-surface-container-low border-none rounded-lg py-3 pl-4 pr-10 text-sm font-medium min-w-[200px] focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer" style="background-image: none;">
<option>Sorting Facility A</option>
<option>Chemical Processing</option>
<option>Logistics &amp; Dispatch</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<button id="startAttendanceBtn" class="bg-primary hover:bg-primary-container text-white px-8 py-3 rounded-lg font-bold text-sm tracking-wide shadow-lg shadow-primary/20 transition-all active:scale-95 flex items-center gap-3">
<span class="material-symbols-outlined">play_circle</span>
                    Start Attendance
                </button>
</div>
<!-- Dashboard Grid -->
<div class="grid grid-cols-12 gap-6 items-stretch">
<!-- Live Camera Feed (Large Left Panel) -->
<div class="col-span-12 bg-surface-container-lowest rounded-xl overflow-hidden shadow-xl shadow-on-surface/5 flex flex-col">
<div class="p-4 flex items-center justify-between bg-surface-container-low">
<div class="flex items-center gap-3">
<div class="w-3 h-3 rounded-full bg-error animate-pulse"></div>
<span class="font-bold text-xs uppercase tracking-tighter">CAM-04 : Entrance Turnstile</span>
</div>
<div class="flex gap-2">
<button class="p-1.5 hover:bg-surface-container-high rounded text-slate-500 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="videocam">videocam</span>
</button>
<button class="p-1.5 hover:bg-surface-container-high rounded text-slate-500 transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="fullscreen">fullscreen</span>
</button>
</div>
</div>
<div class="relative aspect-video bg-black group">
<img alt="Live Monitoring Feed" class="w-full h-full object-cover opacity-80" data-alt="industrial warehouse entrance with employees walking through high-tech security turnstiles, low-key lighting with sharp technical overlays and bounding boxes" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBAT3QIZQnQ1bEv0xuwpB2iWga2nOgXIP-SmUrsJTjs2N7tCMu_S6G7wj_O9Q_PWWZwAELhkgRaNq2pVY0RZV_H6rxQ8_rNk9MnT9tMtGGYp3Hf7Gh1ysYa4fHcVck8g9hb4oXEV6ouKrMbs6w0wZXdB95gOUtGHT_jORHcFUKzMI1PDuKPeeHY8AJNWrja4ChsQn4CJVw63eaCLLWMV7GWoUBymNVeV_HdswawCtsTtsJxE4GfD5fi-9WQkGrr98FIkX2fwVG_RWoy"/>
<!-- AI Overlay: Recognized (hidden by default, shown by JS) -->
<div id="overlay-recognized" class="absolute top-1/4 left-1/3 w-32 h-48 border-2 border-tertiary-fixed-dim rounded-sm" style="display: none;">
<div class="absolute -top-6 left-0 bg-tertiary-fixed-dim text-on-tertiary-fixed px-1.5 py-0.5 text-[10px] font-bold rounded-sm uppercase">
<span id="overlay-recognized-label">ID: — [CONF —]</span>
                            </div>
</div>
<!-- AI Overlay: Unknown (hidden by default, shown by JS) -->
<div id="overlay-unknown" class="absolute top-1/3 right-1/4 w-36 h-52 border-2 border-error rounded-sm" style="display: none;">
<div class="absolute -top-6 left-0 bg-error text-white px-1.5 py-0.5 text-[10px] font-bold rounded-sm uppercase">
                                UNKNOWN [ALERT]
                            </div>
</div>
<!-- Overlay HUD -->
<div class="absolute bottom-6 left-6 right-6 flex justify-between items-end">
<div class="glass-panel p-4 rounded-lg border border-white/20">
<div class="text-[10px] text-on-surface-variant font-bold uppercase tracking-widest mb-1">Current Throughput</div>
<div class="text-2xl font-extrabold text-on-surface tracking-tight">42 <span class="text-xs font-medium text-slate-500">P/MIN</span></div>
</div>
<div class="flex flex-col gap-2 items-end">
<div class="glass-panel px-3 py-1.5 rounded-full flex items-center gap-2 border border-white/20">
<span class="text-[10px] font-bold uppercase">Thermal: 36.6°C</span>
<div class="w-2 h-2 rounded-full bg-tertiary"></div>
</div>
<div class="glass-panel px-3 py-1.5 rounded-full flex items-center gap-2 border border-white/20">
<span class="text-[10px] font-bold uppercase">PPE Status: Pass</span>
<div class="w-2 h-2 rounded-full bg-tertiary"></div>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- FAB Suppression: Contextually not needed here as per requirements but noted -->

<!-- API Integration Scripts -->
<script src="{{ url_for('static', filename='js/api-client.js') }}"></script>
<script src="{{ url_for('static', filename='js/router.js') }}"></script>
<script src="{{ url_for('static', filename='js/utils.js') }}"></script>
<script src="{{ url_for('static', filename='js/attendance.js') }}"></script>
</body></html>
